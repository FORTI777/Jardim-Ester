<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B1C">
<meta name="robots" content="noindex, nofollow">
<title>para a Ester</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;1,400&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<!-- ============ 1. O COFRE ============ -->
<section class="tela" id="tela-cofre">
  <div class="cadeado-caixa" id="cadeado"></div>
  <p class="sussurro" id="dica-senha"></p>
  <input id="campo-senha" type="text" inputmode="numeric" autocomplete="off"
         placeholder="__/__/____" aria-label="a data">
  <button class="botao" id="botao-abrir">abrir</button>
  <p class="aviso-erro" id="erro-senha"></p>
</section>

<!-- ============ VERSÍCULO SOZINHO NA TELA ============ -->
<section class="tela" id="tela-versiculo">
  <p class="versiculo" id="texto-versiculo"></p>
</section>

<!-- ============ 2. O CÉU DAS MEMÓRIAS ============ -->
<section class="tela" id="tela-ceu">
  <div id="fundo-ceu"></div>
  <div id="estrelinhas"></div>
  <svg id="linhas-coracao" viewBox="0 0 100 100" preserveAspectRatio="none"><path id="caminho-coracao"></path></svg>
  <div id="campo-estrelas"></div>
  <div class="topo-ceu">
    <p class="versiculo discreto" id="versiculo-ceu"></p>
  </div>
  <div class="rodape-ceu">
    <p class="sussurro" id="legenda-ceu"></p>
  </div>
</section>

<!-- ============ A CARTA PRINCIPAL ============ -->
<section class="tela rolavel" id="tela-carta">
  <div class="papel" id="papel-carta">
    <p class="texto-carta" id="texto-carta"></p>
    <p class="assinatura-bencao" id="bencao-carta"></p>
  </div>
  <button class="botao claro" id="botao-seguir-carta" style="display:none">seguir</button>
</section>

<!-- ============ 3. O AMANHECER ============ -->
<section class="tela" id="tela-amanhecer">
  <video id="video-amanhecer" playsinline muted style="display:none"></video>
  <p class="versiculo" id="versiculo-amanhecer" style="position:relative;z-index:2"></p>
</section>

<!-- ============ 4. O JARDIM ============ -->
<section class="tela" id="tela-jardim">
  <div id="fundo-jardim"></div>
  <div class="jardim-conteudo">
    <div class="faixa-topo">
      <p class="versiculo discreto" id="versiculo-jardim"></p>
    </div>
    <div id="area-buque"></div>
    <div class="rolagem-canteiros" id="rolagem-canteiros"></div>
  </div>
</section>

<!-- ============ TELA INICIAL DAS VISITAS SEGUINTES ============ -->
<section class="tela" id="tela-inicio">
  <h1 id="titulo-inicio"></h1>
  <p class="sussurro" id="saudacao-inicio"></p>
  <nav class="caminhos" id="caminhos"></nav>
</section>

<!-- ============ A CAIXINHA DE CARTAS ============ -->
<section class="tela rolavel" id="tela-cartas">
  <h2 style="margin-top:34px" id="titulo-cartas"></h2>
  <div class="lista-envelopes" id="lista-envelopes"></div>
</section>

<!-- ============ JANELAS (abrem por cima) ============ -->
<div class="janela" id="janela"><div class="janela-conteudo" id="janela-conteudo"></div></div>
<button class="fechar" id="botao-fechar" style="display:none" aria-label="fechar">&times;</button>
<button class="voltar" id="botao-voltar">voltar</button>
<button id="botao-musica" aria-label="música"></button>
<div id="aviso"></div>

<!-- ============ PAINEL DE TESTE (só com ?teste=1) ============ -->
<div id="painel-teste"></div>

<audio id="audio-musica" loop preload="none"></audio>
<audio id="audio-oracao" preload="none"></audio>

<script src="js/textos.js"></script>
<script src="js/midia.js"></script>
<script src="js/app.js"></script>
</body>
</html>
